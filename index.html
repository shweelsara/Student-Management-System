<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f5f7;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }

        /* Statistics */
        .stats {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .stats h2 {
            margin: 0;
            font-size: 18px;
            color: #666;
        }

        .total-number {
            display: block;
            margin-top: 8px;
            font-size: 32px;
            font-weight: bold;
            color: #1976d2;
        }

        /* Form */
        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            margin-top: 0;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background-color: #1976d2;
            color: white;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        /* Search */
        .search-box {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .search-box input {
            width: 100%;
        }

        /* Message */
        #message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 7px;
            text-align: center;
            font-weight: bold;
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* Table */
        .table-box {
            background-color: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        tr:hover {
            background-color: #f8f8f8;
        }

        .edit-btn {
            background-color: #1976d2;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background-color: #b00020;
            color: white;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            opacity: 0.85;
        }

        .no-results {
            text-align: center;
            padding: 25px;
            color: #777;
            display: none;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }
            h1 {
                font-size: 26px;
            }

            .form-box,
            .search-box,
            .stats {
                padding: 18px;
            }

            .form-row {
                flex-direction: column;
            }

            input {
                width: 100%;
                min-width: 0;
            }

            .add-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>


    <!-- Statistics -->
    <div class="stats">

        <h2>Total Students</h2>

        <span
            id="totalStudents"
            class="total-number"
        >
            0
        </span>

    </div>


    <!-- Message -->
    <div id="message"></div>


    <!-- Add Student -->
    <div class="form-box">

        <h2>Add New Student</h2>

        <div class="form-row">

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <button
                class="add-btn"
                onclick="addStudent()"
            >
                Add Student
            </button>

        </div>

    </div>


    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, department, or email..."
        >

    </div>


    <!-- Students Table -->
    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Student Name</th>
                    <th>Department</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="studentTable"></tbody>

        </table>

        <div
            id="noResults"
            class="no-results"
        >
            No students found.
        </div>

    </div>

</div>


<script>

    // Load students when page opens
    window.addEventListener(
        "DOMContentLoaded",
        loadStudents
    );


    // Show success message
    function showMessage(message) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent = message;

        messageBox.style.display = "block";


        setTimeout(function() {

            messageBox.style.display = "none";

        }, 2500);
    }


    // Update total students
    function updateTotalStudents() {

        const rows =
            document.querySelectorAll(
                "#studentTable tr"
            );

        document.getElementById(
            "totalStudents"
        ).textContent = rows.length;
    }


    // Load students
    async function loadStudents() {

        try {

            const response =
                await fetch("/api/students");

            const students =
                await response.json();

            const table =
                document.getElementById(
                    "studentTable"
                );

            table.innerHTML = "";


            students.forEach(function(student) {

                displayStudent(student);

            });


            updateTotalStudents();
            updateNoResults();


        } catch (error) {

            console.error(
                "Error loading students:",
                error
            );

            alert(
                "Could not load students."
            );
        }
    }


    // Add student
    async function addStudent() {

        const name =
            document
                .getElementById("studentName")
                .value
                .trim();
                const department =
            document
                .getElementById("department")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if (!name || !department || !email) {

            alert(
                "Please fill in all fields."
            );

            return;
        }


        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            alert(
                "Please enter a valid email."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/students",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            department: department,
                            email: email
                        })
                    }
                );


            const student =
                await response.json();


            if (!response.ok) {

                alert(
                    student.message ||
                    "Could not add student."
                );

                return;
            }


            displayStudent(student);


            document.getElementById(
                "studentName"
            ).value = "";

            document.getElementById(
                "department"
            ).value = "";

            document.getElementById(
                "email"
            ).value = "";


            updateTotalStudents();
            updateNoResults();


            showMessage(
                "Student added successfully!"
            );


        } catch (error) {

            console.error(
                "Error adding student:",
                error
            );

            alert(
                "Could not connect to the server."
            );
        }
    }


    // Display student
    function displayStudent(student) {

        const table =
            document.getElementById(
                "studentTable"
            );

        const row =
            table.insertRow();


        row.dataset.id =
            student.id;


        const nameCell =
            row.insertCell(0);

        const departmentCell =
            row.insertCell(1);

        const emailCell =
            row.insertCell(2);

        const actionCell =
            row.insertCell(3);


        nameCell.textContent =
            student.name;

        departmentCell.textContent =
            student.department;

        emailCell.textContent =
            student.email;


        // Edit
        const editButton =
            document.createElement(
                "button"
            );

        editButton.textContent =
            "Edit";

        editButton.className =
            "edit-btn";


        editButton.onclick =
            function() {

                editStudent(
                    student.id,
                    row,
                    nameCell,
                    departmentCell,
                    emailCell
                );
            };


        // Delete
        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.textContent =
            "Delete";

        deleteButton.className =
            "delete-btn";


        deleteButton.onclick =
            function() {

                deleteStudent(
                    student.id,
                    row
                );
            };


        actionCell.appendChild(
            editButton
        );

        actionCell.appendChild(
            deleteButton
        );
    }
    // Edit student
    async function editStudent(
        id,
        row,
        nameCell,
        departmentCell,
        emailCell
    ) {

        const newName =
            prompt(
                "Enter Student Name:",
                nameCell.textContent
            );


        if (newName === null) {
            return;
        }


        const newDepartment =
            prompt(
                "Enter Department:",
                departmentCell.textContent
            );


        if (newDepartment === null) {
            return;
        }


        const newEmail =
            prompt(
                "Enter Email:",
                emailCell.textContent
            );


        if (newEmail === null) {
            return;
        }


        const cleanName =
            newName.trim();

        const cleanDepartment =
            newDepartment.trim();

        const cleanEmail =
            newEmail.trim();


        if (
            !cleanName ||
            !cleanDepartment ||
            !cleanEmail
        ) {

            alert(
                "Please fill in all fields."
            );

            return;
        }


        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(cleanEmail)) {

            alert(
                "Please enter a valid email."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/students/" + id,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: cleanName,
                            department:
                                cleanDepartment,
                            email: cleanEmail
                        })
                    }
                );


            const updatedStudent =
                await response.json();


            if (!response.ok) {

                alert(
                    updatedStudent.message ||
                    "Could not update student."
                );

                return;
            }


            nameCell.textContent =
                updatedStudent.name;

            departmentCell.textContent =
                updatedStudent.department;

            emailCell.textContent =
                updatedStudent.email;


            filterStudents();


            showMessage(
                "Student updated successfully!"
            );


        } catch (error) {

            console.error(
                "Error updating student:",
                error
            );

            alert(
                "Could not connect to the server."
            );
        }
    }


    // Delete student
    async function deleteStudent(
        id,
        row
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this student?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/students/" + id,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.message ||
                    "Could not delete student."
                );

                return;
            }


            row.remove();


            updateTotalStudents();
            updateNoResults();


            showMessage(
                "Student deleted successfully!"
            );


        } catch (error) {

            console.error(
                "Error deleting student:",
                error
            );
            alert(
                "Could not connect to the server."
            );
        }
    }


    // Search
    const searchInput =
        document.getElementById(
            "searchInput"
        );


    searchInput.addEventListener(
        "input",
        filterStudents
    );


    function filterStudents() {

        const searchValue =
            searchInput.value
                .toLowerCase()
                .trim();


        const rows =
            document.querySelectorAll(
                "#studentTable tr"
            );


        rows.forEach(function(row) {

            const name =
                row.cells[0]
                    .textContent
                    .toLowerCase();

            const department =
                row.cells[1]
                    .textContent
                    .toLowerCase();

            const email =
                row.cells[2]
                    .textContent
                    .toLowerCase();

const studentData =
    name + " " + department + " " + email;

const matches =
    studentData.includes(searchValue);
           

            row.style.display =
                matches ? "" : "none";
        });


        updateNoResults();
    }


    // No results message
    function updateNoResults() {

        const rows =
            document.querySelectorAll(
                "#studentTable tr"
            );


        const visibleRows =
            Array.from(rows).filter(
                function(row) {

                    return row.style.display !== "none";

                }
            );


        const noResults =
            document.getElementById(
                "noResults"
            );


        if (
            rows.length === 0 ||
            visibleRows.length === 0
        ) {

            noResults.style.display =
                "block";

        } else {

            noResults.style.display =
                "none";
        }
    }

</script>

</body>
</html>
