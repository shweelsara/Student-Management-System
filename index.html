<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            color: #222;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #222;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #333;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .primary-btn,
        .cancel-btn {
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-btn {
            background-color: #222;
            color: white;
        }

        .primary-btn:hover {
            background-color: #444;
        }

        .cancel-btn {
            background-color: #ddd;
            color: #333;
            display: none;
        }

        .cancel-btn:hover {
            background-color: #ccc;
        }

        .search-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .search-section input {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .search-section input:focus {
            border-color: #333;
        }

        .student-count {
            font-weight: bold;
            color: #444;
            white-space: nowrap;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
            font-weight: bold;
        }

        tbody tr:hover {
            background-color: #f8f8f8;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 13px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .edit-btn {
            background-color: #555;
        }

        .edit-btn:hover {
            background-color: #333;
        }

        .delete-btn {
            background-color: #b00020;
        }

        .delete-btn:hover {
            background-color: #8d001a;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #777;
            display: none;
        }

        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 7px;
            display: none;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .message.error {
            background-color: #ffebee;
            color: #c62828;
            display: block;
        }

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 27px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-section {
                flex-direction: column;
                align-items: stretch;
            }

            .search-section input {
                max-width: 100%;
            }

            .student-count {
                text-align: center;
            }

            .card {
                padding: 18px;
            }

            .button-container {
                flex-direction: column;
            }

            .primary-btn,
            .cancel-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Management System</h1>
            <p>Manage student information easily</p>
        </div>

        <!-- Student Form -->
        <div class="card">

            <h2 class="form-title" id="formTitle">
                Add New Student
            </h2>

            <div id="message" class="message"></div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                    >
                </div>

                <div class="form-group">
                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >
                </div>

            </div>

            <div class="button-container">

                <button
                    class="primary-btn"
                    id="submitButton"
                    onclick="saveStudent()"
                >
                    Add Student
                </button>

                <button
                    class="cancel-btn"
                    id="cancelButton"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </div>

        </div>


        <!-- Students List -->
        <div class="card">

            <div class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search student by name..."
                >

                <div class="student-count">
                    Total Students:
                    <span id="studentCount">0</span>
                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Student Name</th>
                            <th>Department</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="studentTable"></tbody>

                </table>

                <div id="emptyMessage" class="empty-message">
                    No students found.
                </div>

            </div>

        </div>

    </div>


    <script>

        /*
         * Student Management System
         * Data is stored in LocalStorage
         */

        let students =
            JSON.parse(localStorage.getItem("students")) || [];

        let editingStudentId = null;


        // Save students to LocalStorage
        function saveToLocalStorage() {

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }


        // Show message
        function showMessage(text, type) {

            const message =
                document.getElementById("message");

            message.textContent = text;

            message.className =
                "message " + type;

            setTimeout(function () {

                message.className = "message";

                message.textContent = "";

            }, 3000);
        }


        // Clear form
        function clearForm() {

            document.getElementById("studentName").value = "";
            document.getElementById("department").value = "";
            document.getElementById("email").value = "";

            editingStudentId = null;

            document.getElementById("formTitle").textContent =
                "Add New Student";

            document.getElementById("submitButton").textContent =
                "Add Student";

            document.getElementById("cancelButton").style.display =
                "none";
        }


        // Save student
        function saveStudent() {

            const name =
                document.getElementById("studentName")
                .value.trim();

            const department =
                document.getElementById("department")
                .value.trim();

            const email =
                document.getElementById("email")
                .value.trim();


            // Check empty fields
            if (
                name === "" ||
                department === "" ||
                email === ""
            ) {

                showMessage(
                    "Please fill in all fields.",
                    "error"
                );

                return;
            }


            // Validate email
            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                showMessage(
                    "Please enter a valid email address.",
                    "error"
                );

                return;
            }


            // Edit existing student
            if (editingStudentId !== null) {

                const student =
                    students.find(function (student) {

                        return student.id === editingStudentId;

                    });


                if (student) {

                    student.name = name;
                    student.department = department;
                    student.email = email;

                    saveToLocalStorage();

                    clearForm();

                    displayStudents();
                    showMessage(
                        "Student updated successfully.",
                        "success"
                    );
                }

                return;
            }


            // Create new student
            const student = {

                id: Date.now(),

                name: name,

                department: department,

                email: email

            };


            students.push(student);

            saveToLocalStorage();

            clearForm();

            displayStudents();

            showMessage(
                "Student added successfully.",
                "success"
            );
        }


        // Display students
        function displayStudents(studentList = students) {

            const table =
                document.getElementById("studentTable");

            const emptyMessage =
                document.getElementById("emptyMessage");

            const studentCount =
                document.getElementById("studentCount");


            // Clear table
            table.innerHTML = "";


            // Update count
            studentCount.textContent =
                studentList.length;


            // Empty table
            if (studentList.length === 0) {

                emptyMessage.style.display = "block";

                return;

            } else {

                emptyMessage.style.display = "none";
            }


            // Create table rows
            studentList.forEach(function (student) {

                const row =
                    document.createElement("tr");


                // Student name
                const nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    student.name;


                // Department
                const departmentCell =
                    document.createElement("td");

                departmentCell.textContent =
                    student.department;


                // Email
                const emailCell =
                    document.createElement("td");

                emailCell.textContent =
                    student.email;


                // Actions
                const actionCell =
                    document.createElement("td");


                const buttonsContainer =
                    document.createElement("div");

                buttonsContainer.className =
                    "action-buttons";


                // Edit button
                const editButton =
                    document.createElement("button");

                editButton.textContent = "Edit";

                editButton.className =
                    "edit-btn";

                editButton.onclick = function () {

                    editStudent(student.id);

                };


                // Delete button
                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent = "Delete";

                deleteButton.className =
                    "delete-btn";

                deleteButton.onclick = function () {

                    deleteStudent(student.id);

                };


                buttonsContainer.appendChild(editButton);

                buttonsContainer.appendChild(deleteButton);

                actionCell.appendChild(buttonsContainer);


                row.appendChild(nameCell);

                row.appendChild(departmentCell);

                row.appendChild(emailCell);

                row.appendChild(actionCell);


                table.appendChild(row);

            });
        }


        // Edit student
        function editStudent(id) {

            const student =
                students.find(function (student) {

                    return student.id === id;

                });


            if (!student) {

                return;
            }


            document.getElementById("studentName").value =
                student.name;
            document.getElementById("department").value =
                student.department;

            document.getElementById("email").value =
                student.email;


            editingStudentId = id;


            document.getElementById("formTitle").textContent =
                "Edit Student";

            document.getElementById("submitButton").textContent =
                "Update Student";

            document.getElementById("cancelButton").style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        // Cancel editing
        function cancelEdit() {

            clearForm();
        }


        // Delete student
        function deleteStudent(id) {

            const student =
                students.find(function (student) {

                    return student.id === id;

                });


            if (!student) {

                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete " +
                    student.name +
                    "?"
                );


            if (!confirmed) {

                return;
            }


            students =
                students.filter(function (student) {

                    return student.id !== id;

                });


            saveToLocalStorage();

            displayStudents();

            showMessage(
                "Student deleted successfully.",
                "success"
            );
        }


        // Search students
        document
            .getElementById("searchInput")
            .addEventListener("input", function () {

                const searchValue =
                    this.value
                    .trim()
                    .toLowerCase();


                const filteredStudents =
                    students.filter(function (student) {

                        return student.name
                            .toLowerCase()
                            .includes(searchValue);

                    });


                displayStudents(filteredStudents);

            });


        // Display saved students on page load
        displayStudents();

    </script>

</body>

</html>
